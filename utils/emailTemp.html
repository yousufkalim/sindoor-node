<body style="margin: 0; padding: 0">
    <table
      role="presentation"
      style="
        width: 100%;
        border-collapse: collapse;
        border: 0;
        border-spacing: 0;
        background: #ffffff;
      "
    >
      <tr>
        <td align="center" style="padding: 0">
          <table
            role="presentation"

              border-spacing: 0;

            "
          >
            <tr>
              <td
                align="center"

                font-family: fantasy;
                letter-spacing: 0;

                <h2 style="
                font-family: Verdana; color: #e45a5a; ">

                </h2>
                <h4 style="font-family: Verdana; color: #787878;">
                  Your new Password is below
                </h4>

            </tr>

                    font-family: Verdana;

                    border-radius: 10px;
                  "
                >

                </h3>
                </div>

                    font-family: Verdana;
                    color: #787878;">

            <tr>

            </tr>
          </table>
